<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orderdeo | Premium Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); --text: #f8fafc; }
        .light-mode { --glass: rgba(0, 0, 0, 0.05); --border: rgba(0, 0, 0, 0.1); --text: #1e293b; background: #f1f5f9 !important; color: #1e293b !important; }
        
        body { font-family: 'Hind Siliguri', sans-serif; background: #0a0f1d; color: var(--text); transition: 0.4s; overflow-x: hidden; }
        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; }
        
        /* Banner & Card Styles */
        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .slider-container::-webkit-scrollbar { display: none; }
        .slide { min-width: 100%; scroll-snap-align: start; position: relative; }
        
        /* Product Card Style */
        .product-card { background: white; border-radius: 16px; color: black; transition: all 0.3s ease; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        
        .discount-badge { position: absolute; top: 10px; left: 10px; background: #22c55e; color: white; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 10; box-shadow: 0 2px 5px rgba(34,197,94,0.4); }
        .best-price-tag { background: #db2777; color: white; font-size: 10px; padding: 3px 8px; border-radius: 6px; display: inline-block; font-weight: 600; }
        
        .floating-call { position: fixed; bottom: 25px; right: 25px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; z-index: 100; box-shadow: 0 8px 20px rgba(37,211,102,0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom Scrollbar for Modal */
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: rgba(100,100,100,0.3); border-radius: 10px; }
    </style>
</head>
<body class="pb-24">

    <!-- Header Update: Only Logo -->
    <header class="sticky top-0 z-[60] p-3 glass rounded-none border-0 flex justify-between items-center px-6 backdrop-blur-xl shadow-sm">
        <div class="flex items-center">
            <img src="https://i.ibb.co.com/PGtpvz3f/EA975-D03-CDA9-4-A59-8-DB4-5-E217-F8-B2586.png" alt="Orderdeo Logo" class="h-12 md:h-14 w-auto object-contain drop-shadow-md">
        </div>
        <button onclick="document.body.classList.toggle('light-mode')" class="p-2 glass rounded-full text-lg hover:bg-blue-500/20 transition">🌓</button>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        
        <!-- Dynamic Banner Slider -->
        <section id="bannerSlider" class="slider-container w-full h-48 md:h-[350px] rounded-[30px] overflow-hidden mb-8 glass border-0 shadow-2xl">
            <div class="w-full h-full flex items-center justify-center opacity-30">ব্যানার লোড হচ্ছে...</div>
        </section>

        <!-- Search Bar -->
        <div class="relative mb-8">
            <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="পণ্য খুঁজুন..." class="w-full glass p-5 pl-14 rounded-2xl outline-none text-md border border-white/5 focus:border-blue-500/50 transition shadow-inner">
            <span class="absolute left-6 top-5 text-lg opacity-60">🔍</span>
        </div>

        <!-- Categories Quick Filter -->
        <div class="flex gap-3 overflow-x-auto pb-4 mb-5 no-scrollbar">
            <button onclick="filterItems('')" class="glass px-6 py-2.5 rounded-xl whitespace-nowrap text-sm font-semibold hover:bg-blue-600 hover:text-white transition">All Items</button>
            <button onclick="filterItems('লাইট')" class="glass px-6 py-2.5 rounded-xl whitespace-nowrap text-sm font-semibold hover:bg-blue-600 hover:text-white transition">Lights</button>
            <button onclick="filterItems('ফ্যান')" class="glass px-6 py-2.5 rounded-xl whitespace-nowrap text-sm font-semibold hover:bg-blue-600 hover:text-white transition">Fans</button>
            <button onclick="filterItems('গ্যাজেট')" class="glass px-6 py-2.5 rounded-xl whitespace-nowrap text-sm font-semibold hover:bg-blue-600 hover:text-white transition">Gadgets</button>
        </div>

        <!-- Product Section Title -->
        <h2 class="text-xl font-bold mb-6 flex items-center gap-3">🛒 লেটেস্ট প্রোডাক্টস <span class="h-[2px] flex-1 bg-gradient-to-r from-blue-500/40 to-transparent"></span></h2>
        
        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
            <!-- Products will load dynamically from Firestore -->
        </div>
    </main>

    <!-- Floating Call Button -->
    <a href="tel:01700000000" class="floating-call">📞</a>

    <!-- Order Modal (Updated with new fields) -->
    <div id="orderModal" class="fixed inset-0 z-[100] hidden flex items-end md:items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="glass w-full max-w-lg p-6 md:p-8 rounded-t-[30px] md:rounded-[30px] relative max-h-[90vh] overflow-y-auto modal-scroll shadow-2xl border border-white/10">
            
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">অর্ডার কনফার্ম করুন</h2>
                    <p id="targetName" class="text-sm font-medium mt-1 text-gray-300 bg-white/5 px-3 py-1 rounded-lg inline-block"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white bg-white/5 p-2 rounded-full transition">✕</button>
            </div>

            <form id="orderForm" class="space-y-4 mt-6">
                <!-- Name -->
                <div>
                    <label class="text-xs text-gray-400 mb-1.5 block ml-1">আপনার সম্পূর্ণ নাম *</label>
                    <input type="text" id="uName" required placeholder="যেমন: রহিম মিয়া" class="w-full glass p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5">
                </div>
                
                <!-- Phone & WhatsApp Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-400 mb-1.5 block ml-1">ফোন নাম্বার *</label>
                        <input type="tel" id="uPhone" required placeholder="017XXXXXXX" class="w-full glass p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1.5 block ml-1">হোয়াটসঅ্যাপ নাম্বার *</label>
                        <input type="tel" id="uWhatsapp" required placeholder="017XXXXXXX" class="w-full glass p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5">
                    </div>
                </div>

                <!-- Address Grid: Division, District, Upazila -->
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 mb-1.5 block ml-1">বিভাগ *</label>
                        <input type="text" id="uDiv" required placeholder="বিভাগ" class="w-full glass p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1.5 block ml-1">জেলা *</label>
                        <input type="text" id="uDist" required placeholder="জেলা" class="w-full glass p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1.5 block ml-1">উপজেলা *</label>
                        <input type="text" id="uUpazila" required placeholder="উপজেলা" class="w-full glass p-3.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5 text-sm">
                    </div>
                </div>

                <!-- Detailed Address -->
                <div>
                    <label class="text-xs text-gray-400 mb-1.5 block ml-1">বিস্তারিত ঠিকানা *</label>
                    <textarea id="uAddr" required placeholder="গ্রাম/মহল্লা, রাস্তার নাম, বাড়ির নম্বর" class="w-full glass p-3.5 rounded-xl h-24 outline-none focus:ring-2 focus:ring-blue-500 transition border border-white/5 resize-none"></textarea>
                </div>
                
                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 py-4 rounded-xl font-bold text-lg text-white shadow-[0_4px_15px_rgba(37,99,235,0.3)] hover:shadow-[0_4px_25px_rgba(37,99,235,0.5)] transition duration-300">অর্ডার সাবমিট করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Configuration & Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDo1jmjdEne0Vdx7i0Ospot38wLv9Zz4oo",
            authDomain: "sonamoni-b3c3d.firebaseapp.com",
            projectId: "sonamoni-b3c3d",
            storageBucket: "sonamoni-b3c3d.firebasestorage.app",
            messagingSenderId: "1054792405512",
            appId: "1:1054792405512:web:c4950897db2966b43eb7bd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Fetch Admin Banners Live
        onSnapshot(collection(db, "banners"), (snap) => {
            const slider = document.getElementById('bannerSlider');
            slider.innerHTML = '';
            if(snap.empty) {
                slider.innerHTML = `<div class="slide"><img src="https://via.placeholder.com/1200x500?text=Welcome+To+Orderdeo.com" class="w-full h-full object-cover"></div>`;
                return;
            }
            snap.forEach(d => {
                slider.innerHTML += `
                    <div class="slide h-full">
                        <img src="${d.data().url}" class="w-full h-full object-cover opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-transparent flex flex-col justify-center px-10">
                            <h2 class="text-3xl md:text-4xl font-bold text-white leading-tight">সেরা কোয়ালিটির প্রোডাক্ট <br><span class="text-cyan-400">Orderdeo.com</span> এ!</h2>
                        </div>
                    </div>`;
            });
        });

        // Auto Slider Animation
        setInterval(() => {
            const s = document.getElementById('bannerSlider');
            if(s.scrollLeft >= (s.scrollWidth - s.clientWidth)) { s.scrollTo({left: 0, behavior: 'smooth'}); }
            else { s.scrollBy({left: s.clientWidth, behavior: 'smooth'}); }
        }, 5000);

        // 2. Fetch Products Live
        onSnapshot(query(collection(db, "products")), (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const p = doc.data();
                const discount = p.oldPrice ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
                
                grid.innerHTML += `
                    <div class="product-card group" data-name="${p.name.toLowerCase()}">
                        ${discount > 0 ? `<div class="discount-badge">-${discount}%</div>` : ''}
                        <div class="h-48 bg-gray-50 flex items-center justify-center p-3 rounded-t-2xl overflow-hidden relative">
                            <img src="${p.img}" class="w-full h-full object-contain group-hover:scale-110 transition duration-500">
                        </div>
                        <div class="p-4 bg-white">
                            <span class="best-price-tag mb-1">Best Price</span>
                            <h3 class="text-sm font-bold text-slate-800 truncate" title="${p.name}">${p.name}</h3>
                            <div class="flex items-center gap-2 mt-1.5">
                                <span class="text-blue-600 font-extrabold text-lg">৳ ${p.price}</span>
                                ${p.oldPrice ? `<span class="text-gray-400 line-through text-xs font-medium">৳ ${p.oldPrice}</span>` : ''}
                            </div>
                            <div class="text-[11px] text-yellow-500 font-medium mt-1">
                                ⭐ 5/5 (0) - 0 Sold
                            </div>
                            <button onclick="window.triggerOrder('${p.name}')" class="w-full bg-slate-900 text-white mt-4 py-2.5 rounded-xl text-sm font-bold hover:bg-blue-600 transition duration-300">অর্ডার করুন</button>
                        </div>
                    </div>`;
            });
        });

        // 3. User Interface Control
        window.triggerOrder = (name) => {
            document.getElementById('targetName').innerText = `📦 পণ্য: ${name}`;
            document.getElementById('orderModal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('orderModal').classList.add('hidden');

        window.filterItems = (val = '') => {
            const q = val || document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(item => {
                item.style.display = item.dataset.name.includes(q.toLowerCase()) ? 'block' : 'none';
            });
        };

        // 4. Secure Telegram API Order Action (Updated Fields)
        document.getElementById('orderForm').onsubmit = (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "অর্ডার প্রসেস হচ্ছে...";
            btn.disabled = true;

            // Fetching all new inputs
            const pName = document.getElementById('targetName').innerText;
            const uName = document.getElementById('uName').value;
            const uPhone = document.getElementById('uPhone').value;
            const uWhatsapp = document.getElementById('uWhatsapp').value;
            const uDiv = document.getElementById('uDiv').value;
            const uDist = document.getElementById('uDist').value;
            const uUpazila = document.getElementById('uUpazila').value;
            const uAddr = document.getElementById('uAddr').value;

            // Structured Message Body for Telegram
            const msg = `🛍️ **নতুন অর্ডার: Orderdeo.com**\n━━━━━━━━━━━━━━━━━━━━\n${pName}\n\n👤 **ক্রেতার তথ্য:**\n• নাম: ${uName}\n• ফোন: ${uPhone}\n• হোয়াটসঅ্যাপ: ${uWhatsapp}\n\n📍 **ডেলিভারি ঠিকানা:**\n• বিভাগ: ${uDiv}\n• জেলা: ${uDist}\n• উপজেলা: ${uUpazila}\n• বিস্তারিত: ${uAddr}\n━━━━━━━━━━━━━━━━━━━━`;

            fetch(`https://api.telegram.org/bot8722605379:AAEXYRuqomVubbWkM2s3l_0mnYomZ0u9jk4/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: "6045231271", text: msg, parse_mode: 'Markdown' })
            }).then(() => {
                alert("আপনার অর্ডারটি সফলভাবে সাবমিট হয়েছে!");
                closeModal();
                btn.innerText = "অর্ডার সাবমিট করুন";
                btn.disabled = false;
                document.getElementById('orderForm').reset();
            }).catch(() => {
                alert("ইন্টারনেট সমস্যা! আবার চেষ্টা করুন।");
                btn.innerText = "অর্ডার সাবমিট করুন";
                btn.disabled = false;
            });
        };
    </script>
</body>
</html>
